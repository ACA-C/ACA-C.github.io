<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>敬请期待 · 学术共研会</title>
<link rel="icon" href="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/VaiZbSbpDoc28axjN0IcEPnCn4c">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --ink-900:#101D33;
  --ink-800:#16263F;
  --blue-600:#2C5DA0;
  --blue-500:#3A6FB8;
  --blue-300:#8FB0DA;
  --serif:"Noto Serif SC",serif,"Songti SC","SimSun";
  --sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--sans);color:#fff;background:var(--ink-900);line-height:1.75;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;padding:48px 24px;
}
::selection{background:var(--blue-600);color:#fff}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--blue-500);outline-offset:3px;border-radius:2px}

/* 背景层 */
.bg{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%,rgba(58,111,184,.26),transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 90%,rgba(44,93,160,.20),transparent 55%);
}
.bg::before{content:"∑";position:absolute;left:-2%;bottom:-10%;font-family:var(--serif);font-size:min(62vw,600px);line-height:1;color:rgba(255,255,255,.035);user-select:none}
.bg::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:72px 72px;
  mask-image:radial-gradient(ellipse 90% 90% at 50% 40%,#000 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 90% 90% at 50% 40%,#000 30%,transparent 75%);
}

/* 顶部返回 */
.nav-back{
  position:absolute;top:30px;left:32px;z-index:10;
  font-size:14px;color:rgba(255,255,255,.7);letter-spacing:.08em;
  display:inline-flex;align-items:center;gap:8px;transition:color .25s ease;
}
.nav-back:hover{color:#fff}
.nav-back .arrow{display:inline-block;transition:transform .25s ease}
.nav-back:hover .arrow{transform:translateX(-4px)}

/* 主体 */
.main{position:relative;z-index:5;text-align:center;max-width:720px;animation:comeIn .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes comeIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;align-items:center;gap:16px;font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:var(--blue-300);font-weight:500;margin-bottom:34px}
.eyebrow::before,.eyebrow::after{content:"";width:44px;height:1px;background:rgba(255,255,255,.2)}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(44px,8vw,76px);letter-spacing:.22em;text-indent:.22em;line-height:1.3}
.en{margin-top:16px;font-size:clamp(14px,2vw,18px);letter-spacing:.42em;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:300}
.rule{width:56px;height:2px;background:var(--blue-500);margin:40px auto;border:none}
.desc{color:rgba(255,255,255,.66);font-size:16px;letter-spacing:.12em;line-height:2}
.cta{margin-top:48px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:4px;font-size:15px;letter-spacing:.12em;padding:12px 30px;
  border:1px solid transparent;transition:all .25s ease;white-space:nowrap;
}
.btn-primary{background:var(--blue-600);color:#fff}
.btn-primary:hover{background:var(--blue-500);box-shadow:0 8px 20px rgba(44,93,160,.35)}
.btn-ghost{border-color:rgba(255,255,255,.45);color:#fff;background:transparent}
.btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.08)}

@media (max-width:560px){
  .nav-back{left:18px;top:22px}
  .nav-back span.txt{display:none}
  .cta{gap:12px;flex-direction:column;align-items:center}
  .cta .btn{width:min(280px,100%)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>

<a class="nav-back" href="zzzz.html"><span class="arrow">←</span><span class="txt">返回信息中心</span></a>

<main class="main">
  <p class="eyebrow">Coming Soon</p>
  <h1>敬请期待</h1>
  <p class="en">Under Construction</p>
  <hr class="rule">
  <p class="desc">该功能正在筹备中，将尽快与大家见面。<br>感谢你的关注与支持。</p>
  <div class="cta">
    <a class="btn btn-primary" href="zzzz.html">返回信息中心</a>
    <a class="btn btn-ghost" href="index.html">返回首页</a>
  </div>
</main>

</body>
</html>
